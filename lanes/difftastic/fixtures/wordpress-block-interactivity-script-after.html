<div class="wp-block-acme-toggle is-expanded" data-wp-interactive="acme/card">
  <button data-wp-on--click="actions.toggle">Read details</button>
</div>
<script type="module">
wp.interactivity.store('acme/card', {
  state: {
    label: 'Read details',
    expanded: true,
  },
  actions: {
    toggle() {
      state.expanded = ! state.expanded;
    },
  },
});
</script>
