<!-- wp:group {"className":"is-style-card"} -->
<div class="wp-block-group is-style-card">
  <style type="text/css" data-wp-block="acme/card">
    .wp-block-acme-card { color: var(--wp--preset--color--primary); }
  </style>
  <style type="text/css" data-wp-theme="spacing">
    .wp-site-blocks { gap: 1rem; }
  </style>
  <script type="module" data-wp-interactive="acme/card">
    wp.interactivity.store('acme/card', { state: { label: 'Show details', expanded: false } });
  </script>
  <script type="module" data-wp-interactive="acme/gallery">
    wp.interactivity.store('acme/gallery', { state: { active: 0 } });
  </script>
</div>
<!-- /wp:group -->
