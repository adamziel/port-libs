<!doctype html>
<html>
<head>
  <title>HTML Checkbox List Import</title>
</head>
<body>
  <p>Before reviewer checklist.</p>
  <ul class="task-list">
    <li><label><input type="checkbox" />Review imported media</label></li>
    <li><label><input type="checkbox" checked="" />Confirm source links</label></li>
    <li><input type="button" checked="" />Non-task control text</li>
    <li><input id="publish-ready" type="checkbox" checked/><label for="publish-ready">Mark ready to publish</label></li>
  </ul>
  <p><input type="checkbox" checked/>Outside list controls are ignored.</p>
</body>
</html>
