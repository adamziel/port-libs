<!doctype html>
<html>
<head>
<title>HTML Math Renderer Span Import</title>
</head>
<body>
<p>Inline equation <script type="math/tex">x^2 + y^2</script><span class="mjx-chtml"><span>rendered duplicate</span></span> stays single.</p>
<p>Display equation <script type="math/tex; mode=display">\alpha + \omega</script><span class="katex-html"><span>KaTeX duplicate</span></span> stays single.</p>
<p>Legacy preview<span class="MathJax_Preview">preview duplicate</span><span class="MathJax_CHTML">visual duplicate</span> falls back to source text.</p>
</body>
</html>
