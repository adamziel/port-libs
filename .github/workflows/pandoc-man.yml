name: Pandoc man parity

on:
  pull_request:
    paths:
      - '.github/workflows/pandoc-man.yml'
      - 'lanes/pandoc/**'
      - 'tools/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pandoc-man.yml'
      - 'lanes/pandoc/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PANDOC_MAN_UPSTREAM_PINNED_COMMIT: 4f5226df4faa0d66dd2c089465b13886360ab3c2
  PANDOC_EXECUTABLE_VERSION: '3.10'
  PANDOC_EXECUTABLE_LINUX_AMD64_SHA256: e0f8af62d0f267d22baa5bcefe6d5dda3a097ccc60de794b759fe03159923244

jobs:
  focused-man:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, intl, mbstring, zip
          coverage: none

      - name: Lint man parity files
        run: |
          php -l lanes/pandoc/src/ManReader.php
          php -l lanes/pandoc/src/ManCorpusAudit.php
          php -l lanes/pandoc/src/ManUpstreamReaderEvidence.php
          php -l lanes/pandoc/src/PandocConverter.php
          php -l lanes/pandoc/src/PandocFormatRegistry.php
          php -l lanes/pandoc/tests/ManCorpusAuditTest.php
          php -l lanes/pandoc/tests/ManReaderTest.php
          php -l lanes/pandoc/tests/ManUpstreamReaderEvidenceTest.php
          php -l lanes/pandoc/tests/PandocFormatRegistryTest.php
          php -l tools/pandoc-man-corpus-audit.php
          php -l tools/pandoc-man-reader-evidence.php

      - name: Restore pinned Pandoc man upstream cache
        id: pandoc-man-upstream-cache
        uses: actions/cache@v4
        with:
          path: .upstream-cache/pandoc-current
          key: pandoc-man-upstream-sparse-v1-${{ runner.os }}-${{ env.PANDOC_MAN_UPSTREAM_PINNED_COMMIT }}

      - name: Hydrate pinned Pandoc man upstream cache
        if: steps.pandoc-man-upstream-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          target=.upstream-cache/pandoc-current
          mkdir -p "$(dirname "$target")"
          git init "$target"
          git -C "$target" remote add origin https://github.com/jgm/pandoc.git
          git -C "$target" sparse-checkout init --no-cone
          git -C "$target" sparse-checkout set \
            /test/Tests/Readers/Man.hs \
            /src/Text/Pandoc/Readers/Man.hs
          git -C "$target" fetch --depth=1 --filter=blob:none origin "$PANDOC_MAN_UPSTREAM_PINNED_COMMIT"
          git -C "$target" switch --detach FETCH_HEAD

      - name: Verify pinned Pandoc man upstream cache
        run: |
          set -euo pipefail
          target=.upstream-cache/pandoc-current
          test "$(git -C "$target" rev-parse HEAD)" = "$PANDOC_MAN_UPSTREAM_PINNED_COMMIT"
          test -f "$target/test/Tests/Readers/Man.hs"
          test -f "$target/src/Text/Pandoc/Readers/Man.hs"

      - name: Require upstream man reader denominator evidence
        run: |
          php tools/pandoc-man-reader-evidence.php \
            --upstream-root=.upstream-cache/pandoc-current \
            --json \
            --require-test-count=30 \
            --require-runner-not-run \
            --require-runner-plan \
            --require-no-validation-issues

      - name: Install pandoc executable
        run: |
          set -euo pipefail
          archive="/tmp/pandoc-${PANDOC_EXECUTABLE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_EXECUTABLE_VERSION}/pandoc-${PANDOC_EXECUTABLE_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_EXECUTABLE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /tmp
          sudo install -m 0755 "/tmp/pandoc-${PANDOC_EXECUTABLE_VERSION}/bin/pandoc" /usr/local/bin/pandoc
          pandoc --version | head -n 1

      - name: Require man corpus acceptance audit
        run: |
          php tools/pandoc-man-corpus-audit.php \
            --man-root=lanes/pandoc/fixtures/man-corpus-smoke \
            --max-pandoc-native-output-bytes=1048576 \
            --json \
            summary \
            --require-target-files-min=2 \
            --require-local-parse-min=2 \
            --require-no-local-parse-failures \
            --require-no-control-leaks \
            --require-pandoc-parse-min=2 \
            --require-normalized-match-min=2

      - name: Run focused man parity tests
        run: |
          php tools/run-tests.php \
            lanes/pandoc/tests/ManCorpusAuditTest.php \
            lanes/pandoc/tests/ManReaderTest.php \
            lanes/pandoc/tests/ManUpstreamReaderEvidenceTest.php \
            lanes/pandoc/tests/PandocFormatRegistryTest.php
