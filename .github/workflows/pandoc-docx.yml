name: Pandoc DOCX parity

on:
  pull_request:
    paths:
      - '.github/workflows/pandoc-docx.yml'
      - 'PANDOC_STATUS.md'
      - 'lanes/pandoc/**'
      - 'tools/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pandoc-docx.yml'
      - 'PANDOC_STATUS.md'
      - 'lanes/pandoc/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, intl, mbstring, zip
          coverage: none

      - name: Lint DOCX parity files
        run: |
          php -l lanes/pandoc/src/DocxReader.php
          php -l lanes/pandoc/src/DocxOpenXmlReader.php
          php -l lanes/pandoc/src/DocxNativeAstComparisonHarness.php
          php -l lanes/pandoc/src/DocxNativeComparisonSmokeHarness.php
          php -l lanes/pandoc/src/DocxParityCorpusAudit.php
          php -l lanes/pandoc/src/DocxUpstreamCacheManifest.php
          php -l lanes/pandoc/src/DocxUpstreamRunnerPlan.php
          php -l lanes/pandoc/src/DocxWriter.php
          php -l lanes/pandoc/src/DocxWriterGoldenManifest.php
          php -l lanes/pandoc/src/MediaBag.php
          php -l lanes/pandoc/src/ZipPackage.php
          php -l lanes/pandoc/src/ZipPackageEntry.php
          php -l lanes/pandoc/tests/DocxGeneratedFieldMetadataTest.php
          php -l lanes/pandoc/tests/DocxReaderTest.php
          php -l lanes/pandoc/tests/DocxOpenXmlReaderTest.php
          php -l lanes/pandoc/tests/DocxNativeAstComparisonHarnessTest.php
          php -l lanes/pandoc/tests/DocxNativeComparisonSmokeHarnessTest.php
          php -l lanes/pandoc/tests/DocxParityCorpusAuditTest.php
          php -l lanes/pandoc/tests/DocxParityEvidenceStatusTest.php
          php -l lanes/pandoc/tests/DocxUpstreamHaskellInventoryTest.php
          php -l lanes/pandoc/tests/DocxUpstreamCacheManifestTest.php
          php -l lanes/pandoc/tests/DocxUpstreamRunnerPlanTest.php
          php -l lanes/pandoc/tests/DocxWriterTest.php
          php -l lanes/pandoc/tests/MediaBagTest.php
          php -l lanes/pandoc/tests/UpstreamRunnerDependencyAuditTest.php
          php -l lanes/pandoc/tests/ZipPackageTest.php
          php -l tools/pandoc-docx-cache-manifest.php
          php -l tools/pandoc-docx-upstream-runner-plan.php
          php -l tools/pandoc-docx-native-ast.php
          php -l tools/pandoc-docx-native-smoke.php
          php -l tools/pandoc-docx-parity-audit.php
          php -l tools/pandoc-docx-writer-golden-audit.php

      - name: Validate DOCX parity status metadata
        run: jq empty lanes/pandoc/UPSTREAM_TEST_MANIFEST.json lanes/pandoc/UPSTREAM_DOCX_CACHE_MANIFEST.json lanes/pandoc/UPSTREAM_DOCX_HASKELL_INVENTORY.json lanes/pandoc/lane-status.json porting-summary.json

      - name: Restore pinned Pandoc DOCX upstream cache
        id: pandoc-docx-upstream-cache
        uses: actions/cache@v4
        with:
          path: .upstream-cache/pandoc-current
          key: pandoc-docx-upstream-sparse-v3-${{ runner.os }}-612e143fbe6d735b612c4800d21e61b7d44e4dca

      - name: Hydrate pinned Pandoc DOCX upstream cache
        if: steps.pandoc-docx-upstream-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          target=.upstream-cache/pandoc-current
          mkdir -p "$(dirname "$target")"
          git init "$target"
          git -C "$target" remote add origin https://github.com/jgm/pandoc.git
          git -C "$target" sparse-checkout init --no-cone
          git -C "$target" sparse-checkout set \
            /cabal.project \
            /pandoc.cabal \
            /test/test-pandoc.hs \
            /test/lalune.jpg \
            /test/Tests/Readers/Docx.hs \
            /test/Tests/Writers/Docx.hs \
            /test/docx \
            /data/docx
          git -C "$target" fetch --depth=1 --filter=blob:none origin 612e143fbe6d735b612c4800d21e61b7d44e4dca
          git -C "$target" switch --detach FETCH_HEAD

      - name: Verify pinned Pandoc DOCX upstream cache
        run: |
          set -euo pipefail
          target=.upstream-cache/pandoc-current
          test "$(git -C "$target" rev-parse HEAD)" = "612e143fbe6d735b612c4800d21e61b7d44e4dca"
          test -f "$target/cabal.project"
          test -f "$target/pandoc.cabal"
          test -f "$target/test/test-pandoc.hs"
          test -f "$target/test/lalune.jpg"
          test -f "$target/test/Tests/Readers/Docx.hs"
          test -f "$target/test/Tests/Writers/Docx.hs"
          test -d "$target/test/docx"
          test -d "$target/test/docx/golden"
          test -d "$target/data/docx"
          test -f "$target/data/docx/[Content_Types].xml"
          test -f "$target/data/docx/word/document.xml"

      - name: Run optional upstream DOCX cache manifest audit
        run: php tools/pandoc-docx-cache-manifest.php --json

      - name: Run optional upstream DOCX runner preflight plan
        run: |
          mkdir -p .port-libs/pandoc-runner/artifacts/docx-targeted-run .port-libs/pandoc-runner/logs
          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --write-selected-inventory .port-libs/pandoc-runner/artifacts/docx-targeted-run/selected-test-inventory.json \
            > .port-libs/pandoc-runner/artifacts/docx-targeted-run/preflight-plan.json

      - name: Run optional upstream DOCX runner result artifact gate
        run: |
          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --validate-result-artifacts \
            --artifact-root .port-libs/pandoc-runner/artifacts/docx-targeted-run \
            --log-root .port-libs/pandoc-runner/logs \
            > .port-libs/pandoc-runner/artifacts/docx-targeted-run/result-artifact-gate.json

      - name: Upload optional upstream DOCX runner evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-docx-runner-evidence
          path: |
            .port-libs/pandoc-runner/artifacts/docx-targeted-run/*.json
            .port-libs/pandoc-runner/logs/*.txt
          if-no-files-found: warn

      - name: Run optional upstream DOCX/native smoke
        run: php tools/pandoc-docx-native-smoke.php --limit=12

      - name: Require upstream DOCX/native AST parity evidence
        run: php tools/pandoc-docx-native-ast.php summary --require-mapped-parity=74

      - name: Run optional DOCX parser coverage audit
        run: php tools/pandoc-docx-parity-audit.php --fail-on-regression

      - name: Require DOCX writer golden stable comparison
        run: |
          php tools/pandoc-docx-writer-golden-audit.php \
            --json \
            --generate-supported-dir .port-libs/pandoc-docx-writer-golden/generated \
            --require-generated-stable-matches 38

      - name: Run focused DOCX parity tests
        run: |
          php tools/run-tests.php \
            lanes/pandoc/tests/DocxParityEvidenceStatusTest.php \
            lanes/pandoc/tests/DocxUpstreamHaskellInventoryTest.php \
            lanes/pandoc/tests/DocxUpstreamCacheManifestTest.php \
            lanes/pandoc/tests/DocxUpstreamRunnerPlanTest.php \
            lanes/pandoc/tests/UpstreamRunnerDependencyAuditTest.php \
            lanes/pandoc/tests/DocxNativeAstComparisonHarnessTest.php \
            lanes/pandoc/tests/DocxNativeComparisonSmokeHarnessTest.php \
            lanes/pandoc/tests/DocxParityCorpusAuditTest.php \
            lanes/pandoc/tests/DocxReaderTest.php \
            lanes/pandoc/tests/DocxOpenXmlReaderTest.php \
            lanes/pandoc/tests/DocxGeneratedFieldMetadataTest.php \
            lanes/pandoc/tests/DocxWriterTest.php \
            lanes/pandoc/tests/ZipPackageTest.php \
            lanes/pandoc/tests/MediaBagTest.php

      - name: Summarize DOCX parity evidence
        if: always()
        run: |
          {
            echo "## DOCX parity evidence"
            echo ""
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Runner evidence artifact: pandoc-docx-runner-evidence"
            echo "- Focused gates: cache manifest, runner plan, native smoke, AST parity, parser audit, writer golden audit, DOCX tests"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish DOCX parity commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Focused DOCX parity evidence passed' || 'Focused DOCX parity evidence needs attention' }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'error' || 'failure' }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api repos/${{ github.repository }}/statuses/"$STATUS_SHA" \
            -f state="$STATUS_STATE" \
            -f context='Pandoc DOCX parity / evidence' \
            -f target_url="$STATUS_TARGET_URL" \
            -f description="$STATUS_DESCRIPTION"
