name: Pandoc DOCX parity

on:
  pull_request:
    paths:
      - '.github/workflows/pandoc-docx.yml'
      - 'PANDOC_STATUS.md'
      - 'lanes/pandoc/**'
      - 'tools/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pandoc-docx.yml'
      - 'PANDOC_STATUS.md'
      - 'lanes/pandoc/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      run_upstream_docx_tasty:
        description: Run the pinned upstream DOCX Cabal/Tasty pattern and gate result artifacts.
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  statuses: write

env:
  PANDOC_DOCX_RUNNER_PINNED_COMMIT: 0640c4c9859aa5a3ede082c190fcd5883c24ac83
  PANDOC_DOCX_RUNNER_UPSTREAM_ROOT: .upstream-cache/pandoc-docx-runner-pinned

jobs:
  focused-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, intl, mbstring, zip
          coverage: none

      - name: Lint DOCX parity files
        run: |
          php -l lanes/pandoc/src/DocxReader.php
          php -l lanes/pandoc/src/DocxOpenXmlReader.php
          php -l lanes/pandoc/src/DocxNativeAstComparisonHarness.php
          php -l lanes/pandoc/src/DocxNativeComparisonSmokeHarness.php
          php -l lanes/pandoc/src/DocxParityCorpusAudit.php
          php -l lanes/pandoc/src/DocxUpstreamCacheManifest.php
          php -l lanes/pandoc/src/DocxUpstreamFocusedReaderEvidence.php
          php -l lanes/pandoc/src/DocxUpstreamRunnerPlan.php
          php -l lanes/pandoc/src/DocxWriter.php
          php -l lanes/pandoc/src/DocxWriterGoldenManifest.php
          php -l lanes/pandoc/src/MediaBag.php
          php -l lanes/pandoc/src/ZipPackage.php
          php -l lanes/pandoc/src/ZipPackageEntry.php
          php -l lanes/pandoc/tests/DocxGeneratedFieldMetadataTest.php
          php -l lanes/pandoc/tests/DocxReaderTest.php
          php -l lanes/pandoc/tests/DocxOpenXmlReaderTest.php
          php -l lanes/pandoc/tests/DocxNativeAstComparisonHarnessTest.php
          php -l lanes/pandoc/tests/DocxNativeComparisonSmokeHarnessTest.php
          php -l lanes/pandoc/tests/DocxParityCorpusAuditTest.php
          php -l lanes/pandoc/tests/DocxParityEvidenceStatusTest.php
          php -l lanes/pandoc/tests/DocxUpstreamHaskellInventoryTest.php
          php -l lanes/pandoc/tests/DocxUpstreamCacheManifestTest.php
          php -l lanes/pandoc/tests/DocxUpstreamFocusedReaderEvidenceTest.php
          php -l lanes/pandoc/tests/DocxUpstreamRunnerPlanTest.php
          php -l lanes/pandoc/tests/DocxWriterTest.php
          php -l lanes/pandoc/tests/MediaBagTest.php
          php -l lanes/pandoc/tests/UpstreamRunnerDependencyAuditTest.php
          php -l lanes/pandoc/tests/ZipPackageTest.php
          php -l tools/pandoc-docx-cache-manifest.php
          php -l tools/pandoc-docx-focused-reader-evidence.php
          php -l tools/pandoc-docx-upstream-runner-plan.php
          php -l tools/pandoc-docx-native-ast.php
          php -l tools/pandoc-docx-native-smoke.php
          php -l tools/pandoc-docx-parity-audit.php
          php -l tools/pandoc-docx-writer-golden-audit.php

      - name: Validate DOCX parity status metadata
        run: jq empty lanes/pandoc/UPSTREAM_TEST_MANIFEST.json lanes/pandoc/UPSTREAM_DOCX_CACHE_MANIFEST.json lanes/pandoc/UPSTREAM_DOCX_HASKELL_INVENTORY.json lanes/pandoc/UPSTREAM_DOCX_HASKELL_FOCUSED_READER_EVIDENCE.json lanes/pandoc/lane-status.json porting-summary.json

      - name: Restore pinned Pandoc DOCX upstream cache
        id: pandoc-docx-upstream-cache
        uses: actions/cache@v4
        with:
          path: .upstream-cache/pandoc-current
          key: pandoc-docx-upstream-sparse-v3-${{ runner.os }}-612e143fbe6d735b612c4800d21e61b7d44e4dca

      - name: Hydrate pinned Pandoc DOCX upstream cache
        if: steps.pandoc-docx-upstream-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          target=.upstream-cache/pandoc-current
          mkdir -p "$(dirname "$target")"
          git init "$target"
          git -C "$target" remote add origin https://github.com/jgm/pandoc.git
          git -C "$target" sparse-checkout init --no-cone
          git -C "$target" sparse-checkout set \
            /cabal.project \
            /pandoc.cabal \
            /test/test-pandoc.hs \
            /test/lalune.jpg \
            /test/Tests/Readers/Docx.hs \
            /test/Tests/Writers/Docx.hs \
            /test/docx \
            /data/docx
          git -C "$target" fetch --depth=1 --filter=blob:none origin 612e143fbe6d735b612c4800d21e61b7d44e4dca
          git -C "$target" switch --detach FETCH_HEAD

      - name: Verify pinned Pandoc DOCX upstream cache
        run: |
          set -euo pipefail
          target=.upstream-cache/pandoc-current
          test "$(git -C "$target" rev-parse HEAD)" = "612e143fbe6d735b612c4800d21e61b7d44e4dca"
          test -f "$target/cabal.project"
          test -f "$target/pandoc.cabal"
          test -f "$target/test/test-pandoc.hs"
          test -f "$target/test/lalune.jpg"
          test -f "$target/test/Tests/Readers/Docx.hs"
          test -f "$target/test/Tests/Writers/Docx.hs"
          test -d "$target/test/docx"
          test -d "$target/test/docx/golden"
          test -d "$target/data/docx"
          test -f "$target/data/docx/[Content_Types].xml"
          test -f "$target/data/docx/word/document.xml"

      - name: Run optional upstream DOCX cache manifest audit
        run: php tools/pandoc-docx-cache-manifest.php --json

      - name: Require focused upstream DOCX reader evidence
        run: |
          php tools/pandoc-docx-focused-reader-evidence.php \
            --json \
            --docx-dir .upstream-cache/pandoc-current/test/docx \
            --require-covered 36 \
            --require-targeted-checks 36 \
            --require-no-targeted-failures

      - name: Run optional upstream DOCX runner preflight plan
        run: |
          mkdir -p .port-libs/pandoc-runner/artifacts/docx-targeted-run .port-libs/pandoc-runner/logs
          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --write-selected-inventory .port-libs/pandoc-runner/artifacts/docx-targeted-run/selected-test-inventory.json \
            > .port-libs/pandoc-runner/artifacts/docx-targeted-run/preflight-plan.json

      - name: Run optional upstream DOCX runner result artifact gate
        run: |
          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --validate-result-artifacts \
            --artifact-root .port-libs/pandoc-runner/artifacts/docx-targeted-run \
            --log-root .port-libs/pandoc-runner/logs \
            > .port-libs/pandoc-runner/artifacts/docx-targeted-run/result-artifact-gate.json

      - name: Hydrate pinned Pandoc DOCX runner checkout
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        run: |
          set -euo pipefail
          target="${PANDOC_DOCX_RUNNER_UPSTREAM_ROOT}"
          mkdir -p "$(dirname "$target")"
          if [ ! -d "$target/.git" ]; then
            git init "$target"
            git -C "$target" remote add origin https://github.com/jgm/pandoc.git
          fi
          git -C "$target" fetch --depth=1 origin "$PANDOC_DOCX_RUNNER_PINNED_COMMIT"
          git -C "$target" switch --detach FETCH_HEAD
          if [ "$(git -C "$target" config --bool core.sparseCheckout || true)" = "true" ]; then
            git -C "$target" sparse-checkout disable
          fi
          test "$(git -C "$target" rev-parse HEAD)" = "$PANDOC_DOCX_RUNNER_PINNED_COMMIT"
          test -f "$target/cabal.project"
          test -f "$target/pandoc.cabal"
          test -f "$target/test/test-pandoc.hs"
          test -f "$target/test/Tests/Readers/Docx.hs"
          test -f "$target/test/Tests/Writers/Docx.hs"
          test -d "$target/test/docx"
          test -d "$target/test/docx/golden"
          test -d "$target/data/docx"
          test -f "$target/data/docx/[Content_Types].xml"

      - name: Set up Haskell for targeted DOCX runner
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.12.1.0'

      - name: Restore targeted DOCX runner Cabal cache
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .port-libs/pandoc-runner/cabal-home
            .port-libs/pandoc-runner/cache
            .port-libs/pandoc-runner/state
          key: pandoc-docx-runner-cabal-${{ runner.os }}-ghc-9.10.3-cabal-3.12.1.0-${{ env.PANDOC_DOCX_RUNNER_PINNED_COMMIT }}

      - name: Prime targeted DOCX runner Cabal store
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        run: |
          set -euo pipefail
          target="${PANDOC_DOCX_RUNNER_UPSTREAM_ROOT}"
          export CABAL_DIR="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/cabal-home"
          export CABAL_CONFIG="$CABAL_DIR/config"
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/cache"
          export XDG_STATE_HOME="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/state"
          export TMPDIR="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/tmp"
          mkdir -p "$CABAL_DIR" "$(dirname "$CABAL_CONFIG")" "$XDG_CACHE_HOME" "$XDG_STATE_HOME" "$TMPDIR"
          if [ ! -f "$CABAL_CONFIG" ]; then
            cabal user-config init
          fi
          (
            cd "$target"
            cabal v2-update
            cabal v2-build \
              --project-dir=. \
              --builddir=.port-libs/pandoc-runner/cabal-build/docx-targeted-run \
              --only-dependencies \
              --enable-tests \
              --disable-benchmarks \
              test:test-pandoc \
              test:test-pandoc-lua-engine
          )

      - name: Generate pinned DOCX selected inventory for targeted runner
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        run: |
          set -euo pipefail
          artifact_root=.port-libs/pandoc-runner/artifacts/docx-targeted-run
          mkdir -p "$artifact_root" .port-libs/pandoc-runner/logs
          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --upstream-root "$PANDOC_DOCX_RUNNER_UPSTREAM_ROOT" \
            --write-selected-inventory "$artifact_root/selected-test-inventory.json" \
            > "$artifact_root/preflight-plan.json"
          jq -e '
            .selectedTestInventory.skipped == false
            and .selectedTestInventory.upstream.sourceCommitMatchesPinned == true
            and .localExecutionReadiness.checks.sourceCommitMatchesPinned == true
          ' "$artifact_root/preflight-plan.json"

      - name: Run targeted upstream DOCX Cabal/Tasty pattern
        id: targeted-docx-tasty
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        run: |
          set -euo pipefail
          target="${PANDOC_DOCX_RUNNER_UPSTREAM_ROOT}"
          artifact_root=.port-libs/pandoc-runner/artifacts/docx-targeted-run
          log_root=.port-libs/pandoc-runner/logs
          export CABAL_DIR="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/cabal-home"
          export CABAL_CONFIG="$CABAL_DIR/config"
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/cache"
          export XDG_STATE_HOME="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/state"
          export TMPDIR="$GITHUB_WORKSPACE/.port-libs/pandoc-runner/tmp"

          run_plan_command() {
            local command_line="$1"
            local log_file="$2"
            set +e
            (
              cd "$target"
              printf '$ %s\n' "$command_line"
              bash -o pipefail -c "$command_line"
              command_exit=$?
              printf 'exitCode: %d\n' "$command_exit"
              exit "$command_exit"
            ) 2>&1 | tee "$log_file"
            local status="${PIPESTATUS[0]}"
            return "$status"
          }

          dependency_cmd="$(jq -r '.commands.dependencyDryRun.commandLine' "$artifact_root/preflight-plan.json")"
          list_cmd="$(jq -r '.commands.listDocxTests.commandLine' "$artifact_root/preflight-plan.json")"
          targeted_cmd="$(jq -r '.commands.targetedDocxRun.commandLine' "$artifact_root/preflight-plan.json")"

          run_plan_command "$dependency_cmd" "$log_root/runner-test-dependencies.txt"
          dependency_exit=$?
          set -e
          if [ "$dependency_exit" -ne 0 ]; then
            exit "$dependency_exit"
          fi
          run_plan_command "$list_cmd" "$log_root/docx-targeted-list-tests.txt"
          list_exit=$?
          set -e
          if [ "$list_exit" -ne 0 ]; then
            exit "$list_exit"
          fi

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          run_plan_command "$targeted_cmd" "$log_root/docx-targeted-run.txt"
          targeted_exit=$?
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --upstream-root "$PANDOC_DOCX_RUNNER_UPSTREAM_ROOT" \
            --artifact-root "$artifact_root" \
            --log-root "$log_root" \
            --write-result-artifact "$artifact_root/result.json" \
            --result-started-at-utc "$started_at" \
            --result-finished-at-utc "$finished_at" \
            > "$artifact_root/result-writer.json"
          echo "targeted_exit=$targeted_exit" >> "$GITHUB_OUTPUT"

      - name: Require targeted upstream DOCX runner artifact gate
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        run: |
          set -euo pipefail
          artifact_root=.port-libs/pandoc-runner/artifacts/docx-targeted-run
          php tools/pandoc-docx-upstream-runner-plan.php \
            --json \
            --upstream-root "$PANDOC_DOCX_RUNNER_UPSTREAM_ROOT" \
            --validate-result-artifacts \
            --artifact-root "$artifact_root" \
            --log-root .port-libs/pandoc-runner/logs \
            > "$artifact_root/result-artifact-gate.json"
          jq -e '
            .resultArtifactGate.status == "admissible-targeted-runner-result-artifacts-no-parity-claim"
            and .resultArtifactGate.admissionReady == true
          ' "$artifact_root/result-artifact-gate.json"

      - name: Upload optional upstream DOCX runner evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-docx-runner-evidence
          path: |
            .port-libs/pandoc-runner/artifacts/docx-targeted-run/*.json
            .port-libs/pandoc-runner/logs/*.txt
          if-no-files-found: warn

      - name: Require targeted upstream DOCX Tasty pass
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream_docx_tasty == 'true'
        run: test "${{ steps.targeted-docx-tasty.outputs.targeted_exit }}" = "0"

      - name: Run optional upstream DOCX/native smoke
        run: php tools/pandoc-docx-native-smoke.php --limit=12

      - name: Require upstream DOCX/native AST parity evidence
        run: php tools/pandoc-docx-native-ast.php summary --require-mapped-parity=74

      - name: Run optional DOCX parser coverage audit
        run: php tools/pandoc-docx-parity-audit.php --fail-on-regression

      - name: Require DOCX writer golden stable comparison
        run: |
          php tools/pandoc-docx-writer-golden-audit.php \
            --json \
            --generate-supported-dir .port-libs/pandoc-docx-writer-golden/generated \
            --require-generated-stable-matches 38

      - name: Run focused DOCX parity tests
        run: |
          php tools/run-tests.php \
            lanes/pandoc/tests/DocxParityEvidenceStatusTest.php \
            lanes/pandoc/tests/DocxUpstreamHaskellInventoryTest.php \
            lanes/pandoc/tests/DocxUpstreamFocusedReaderEvidenceTest.php \
            lanes/pandoc/tests/DocxUpstreamCacheManifestTest.php \
            lanes/pandoc/tests/DocxUpstreamRunnerPlanTest.php \
            lanes/pandoc/tests/UpstreamRunnerDependencyAuditTest.php \
            lanes/pandoc/tests/DocxNativeAstComparisonHarnessTest.php \
            lanes/pandoc/tests/DocxNativeComparisonSmokeHarnessTest.php \
            lanes/pandoc/tests/DocxParityCorpusAuditTest.php \
            lanes/pandoc/tests/DocxReaderTest.php \
            lanes/pandoc/tests/DocxOpenXmlReaderTest.php \
            lanes/pandoc/tests/DocxGeneratedFieldMetadataTest.php \
            lanes/pandoc/tests/DocxWriterTest.php \
            lanes/pandoc/tests/ZipPackageTest.php \
            lanes/pandoc/tests/MediaBagTest.php

      - name: Summarize DOCX parity evidence
        if: always()
        run: |
          {
            echo "## DOCX parity evidence"
            echo ""
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Runner evidence artifact: pandoc-docx-runner-evidence"
            echo "- Focused gates: cache manifest, focused reader evidence, runner plan, native smoke, AST parity, parser audit, writer golden audit, DOCX tests"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish DOCX parity commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Focused DOCX parity evidence passed' || 'Focused DOCX parity evidence needs attention' }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'error' || 'failure' }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api repos/${{ github.repository }}/statuses/"$STATUS_SHA" \
              -f state="$STATUS_STATE" \
              -f context='Pandoc DOCX parity / evidence' \
              -f target_url="$STATUS_TARGET_URL" \
              -f description="$STATUS_DESCRIPTION" \
              >/dev/null 2>&1; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 2))
              echo "::warning::GitHub status API attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::warning::Could not publish the advisory DOCX commit status after five attempts; the job result remains authoritative"
