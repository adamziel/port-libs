name: Playground converter

on:
  pull_request:
    paths:
      - '.github/workflows/playground-converter.yml'
      - 'lanes/pandoc/**'
      - 'lanes/markerpdf/**'
      - 'pandoc-showcase/playground-converter.*'
      - 'pandoc-showcase/examples.*'
      - 'pandoc-showcase/examples-index.json'
      - 'pandoc-showcase/pdf-jbig2-rasterizer.mjs'
      - 'pandoc-showcase/vendor/pdfjs-jbig2/**'
      - 'pandoc-showcase/pdf-jpx-rasterizer.mjs'
      - 'pandoc-showcase/vendor/pdfjs-openjpeg/**'
      - 'pandoc-showcase/pdfjs-form-rasterizer.mjs'
      - 'pandoc-showcase/pdfjs-facts-provider.mjs'
      - 'pandoc-showcase/vendor/pdfjs/**'
      - 'pandoc-showcase/playground/**'
      - 'tools/build-pandoc-showcase.php'
      - 'tools/pdf-layout-corpus-manifest.json'
      - 'tools/e2e-pdf-layout-corpus.mjs'
      - 'tools/check-showcase-examples-page.js'
      - 'tools/check-playground-converter-ui.js'
      - 'tools/check-pdfjs-facts-provider.mjs'
      - 'tools/decode-pdf-jbig2-media.mjs'
      - 'tools/check-pdf-jbig2-rasterizer.mjs'
      - 'tools/decode-pdf-jpx-media.mjs'
      - 'tools/check-pdf-jpx-rasterizer.mjs'
      - 'tools/decode-pdf-raster-media.mjs'
      - 'tools/measure-pandoc-import-memory.php'
      - 'tools/build-playground-converter-plugin.php'
      - 'tools/vendor-pdfjs.sh'
      - 'tools/playground-converter-plugin/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/playground-converter.yml'
      - 'lanes/pandoc/**'
      - 'lanes/markerpdf/**'
      - 'pandoc-showcase/playground-converter.*'
      - 'pandoc-showcase/examples.*'
      - 'pandoc-showcase/examples-index.json'
      - 'pandoc-showcase/pdf-jbig2-rasterizer.mjs'
      - 'pandoc-showcase/vendor/pdfjs-jbig2/**'
      - 'pandoc-showcase/pdf-jpx-rasterizer.mjs'
      - 'pandoc-showcase/vendor/pdfjs-openjpeg/**'
      - 'pandoc-showcase/pdfjs-form-rasterizer.mjs'
      - 'pandoc-showcase/pdfjs-facts-provider.mjs'
      - 'pandoc-showcase/vendor/pdfjs/**'
      - 'pandoc-showcase/playground/**'
      - 'tools/build-pandoc-showcase.php'
      - 'tools/pdf-layout-corpus-manifest.json'
      - 'tools/e2e-pdf-layout-corpus.mjs'
      - 'tools/check-showcase-examples-page.js'
      - 'tools/check-playground-converter-ui.js'
      - 'tools/check-pdfjs-facts-provider.mjs'
      - 'tools/decode-pdf-jbig2-media.mjs'
      - 'tools/check-pdf-jbig2-rasterizer.mjs'
      - 'tools/decode-pdf-jpx-media.mjs'
      - 'tools/check-pdf-jpx-rasterizer.mjs'
      - 'tools/decode-pdf-raster-media.mjs'
      - 'tools/measure-pandoc-import-memory.php'
      - 'tools/build-playground-converter-plugin.php'
      - 'tools/vendor-pdfjs.sh'
      - 'tools/playground-converter-plugin/**'
  workflow_dispatch:

concurrency:
  group: playground-converter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-playground-converter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, intl, mbstring, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint converter files
        run: |
          php -l lanes/markerpdf/src/BrowserPdfFactsProvider.php
          php -l lanes/markerpdf/src/NativePdfFactsProvider.php
          php -l lanes/markerpdf/src/PdfDocumentFacts.php
          php -l lanes/markerpdf/src/PdfDocumentFactsMerger.php
          php -l lanes/markerpdf/src/PdfFactsProvider.php
          php -l lanes/markerpdf/src/PdfMetadataExtractor.php
          php -l lanes/markerpdf/src/PdfPageFacts.php
          php -l lanes/markerpdf/src/PdfTextExtractor.php
          php -l lanes/markerpdf/tests/BrowserPdfFactsProviderTest.php
          php -l lanes/markerpdf/tests/PdfDecodeParmsTest.php
          php -l lanes/markerpdf/tests/PdfDocumentFactsMergerTest.php
          php -l lanes/markerpdf/tests/PdfMetadataHardeningTest.php
          php -l lanes/markerpdf/tests/PdfFormXObjectPlacementTest.php
          php -l lanes/markerpdf/tests/PdfPageFactsTest.php
          php -l lanes/pandoc/src/BibtexCslParser.php
          php -l lanes/pandoc/src/BibtexCslProcessor.php
          php -l lanes/pandoc/src/EpubReader.php
          php -l lanes/pandoc/src/JiraInlineSpanIndex.php
          php -l lanes/pandoc/src/JiraReader.php
          php -l lanes/pandoc/src/PdfReader.php
          php -l lanes/pandoc/src/PdfTextFidelityLedger.php
          php -l lanes/pandoc/tests/BibtexCslProcessorTest.php
          php -l lanes/pandoc/tests/EpubReaderTest.php
          php -l lanes/pandoc/tests/EpubXmlEncodingAndProcessingInstructionRecoveryTest.php
          php -l lanes/pandoc/tests/JiraReaderHardeningTest.php
          php -l lanes/pandoc/tests/JiraReaderTest.php
          php -l tools/playground-converter-plugin/port-libs-playground-converter.php
          php -l lanes/pandoc/tests/PlaygroundConverterPluginTest.php
          php -l lanes/pandoc/tests/PdfFormXObjectPlacementMetadataTest.php
          php -l lanes/pandoc/tests/PandocImportMemoryBudgetTest.php
          php -l lanes/pandoc/tests/PdfImportCompletenessTest.php
          php -l lanes/pandoc/tests/PdfReaderDocumentFactsTest.php
          php -l lanes/pandoc/tests/PdfReaderCorpusQualityTest.php
          php -l lanes/pandoc/tests/PdfRegionAwareLayoutTest.php
          php -l lanes/pandoc/tests/PdfReaderTest.php
          php -l lanes/pandoc/tests/PdfTextFidelityLedgerTest.php
          php -l lanes/pandoc/tests/ShowcaseHaskellReferenceTimeoutTest.php
          php -l lanes/pandoc/tests/ShowcaseImportQualityManifestTest.php
          php -l lanes/pandoc/tests/ShowcaseQualitySignatureTest.php
          php -l tools/build-pandoc-showcase.php
          node --check pandoc-showcase/playground-converter.js
          node --check pandoc-showcase/examples.js
          node --check pandoc-showcase/pdf-jbig2-rasterizer.mjs
          node --check pandoc-showcase/pdf-jpx-rasterizer.mjs
          node --check pandoc-showcase/pdfjs-form-rasterizer.mjs
          node --check pandoc-showcase/pdfjs-facts-provider.mjs
          node --check tools/playground-converter-plugin/assets/admin-importer.mjs
          node --check tools/decode-pdf-jbig2-media.mjs
          node --check tools/decode-pdf-jpx-media.mjs
          node --check tools/decode-pdf-raster-media.mjs
          node --check tools/e2e-pdf-layout-corpus.mjs
          node tools/check-playground-converter-ui.js
          node tools/check-pdfjs-facts-provider.mjs
          php tools/build-pandoc-showcase.php --build-examples-page
          node tools/check-showcase-examples-page.js
          git diff --exit-code -- pandoc-showcase/examples.html pandoc-showcase/examples.css pandoc-showcase/examples.js pandoc-showcase/examples-index.json
          node tools/check-pdf-jbig2-rasterizer.mjs
          node tools/check-pdf-jpx-rasterizer.mjs

      - name: Run converter tests
        run: |
          php tools/run-tests.php \
            lanes/markerpdf/tests/BrowserPdfFactsProviderTest.php \
            lanes/markerpdf/tests/PdfDecodeParmsTest.php \
            lanes/markerpdf/tests/PdfDocumentFactsMergerTest.php \
            lanes/markerpdf/tests/PdfMetadataHardeningTest.php \
            lanes/markerpdf/tests/PdfFormXObjectPlacementTest.php \
            lanes/markerpdf/tests/PdfPageFactsTest.php \
            lanes/pandoc/tests/BibtexCslProcessorTest.php \
            lanes/pandoc/tests/EpubReaderTest.php \
            lanes/pandoc/tests/EpubXmlEncodingAndProcessingInstructionRecoveryTest.php \
            lanes/pandoc/tests/JiraReaderHardeningTest.php \
            lanes/pandoc/tests/JiraReaderTest.php \
            lanes/pandoc/tests/PlaygroundConverterPluginTest.php \
            lanes/pandoc/tests/PdfFormXObjectPlacementMetadataTest.php \
            lanes/pandoc/tests/PandocImportMemoryBudgetTest.php \
            lanes/pandoc/tests/PdfImportCompletenessTest.php \
            lanes/pandoc/tests/PdfReaderDocumentFactsTest.php \
            lanes/pandoc/tests/PdfReaderCorpusQualityTest.php \
            lanes/pandoc/tests/PdfRegionAwareLayoutTest.php \
            lanes/pandoc/tests/PdfReaderTest.php \
            lanes/pandoc/tests/PdfTextFidelityLedgerTest.php \
            lanes/pandoc/tests/ShowcaseHaskellReferenceTimeoutTest.php \
            lanes/pandoc/tests/ShowcaseImportQualityManifestTest.php \
            lanes/pandoc/tests/ShowcaseQualitySignatureTest.php

      - name: Build plugin archive
        run: |
          php tools/build-playground-converter-plugin.php
          test -s pandoc-showcase/playground/port-libs-playground-converter.zip

      - name: Verify archive includes current converter code
        run: |
          set -euo pipefail
          archive=pandoc-showcase/playground/port-libs-playground-converter.zip
          unzip -p "$archive" port-libs-playground-converter/port-libs-playground-converter.php > "$RUNNER_TEMP/port-libs-playground-converter.php"
          unzip -Z1 "$archive" > "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'plpc_collection_from_zip' "$RUNNER_TEMP/port-libs-playground-converter.php"
          grep -q 'plpc_find_collection_image' "$RUNNER_TEMP/port-libs-playground-converter.php"
          grep -q 'assets/admin-importer.js' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/pdfjs-form-rasterizer.js' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/pdfjs-facts-provider.js' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/vendor/pdfjs/pdf.min.js' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/pdf-jpx-rasterizer.js' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/pdf-jbig2-rasterizer.js' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/vendor/pdfjs/wasm/openjpeg.wasm' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"
          grep -q 'assets/vendor/pdfjs/wasm/jbig2.wasm' "$RUNNER_TEMP/port-libs-playground-converter-files.txt"

      - name: Verify PDF layout corpus in Chrome
        run: |
          set -euo pipefail
          mkdir -p artifacts/pdf-layout-screenshots
          php -S 127.0.0.1:4174 -t pandoc-showcase >/tmp/port-libs-showcase-server.log 2>&1 &
          server_pid=$!
          chrome_binary="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$chrome_binary" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/port-libs-chrome-profile \
            about:blank >/tmp/port-libs-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$server_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null
          node tools/e2e-pdf-layout-corpus.mjs \
            --url http://127.0.0.1:4174/examples.html \
            --output artifacts/pdf-layout-screenshots

      - name: Upload PDF layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-layout-screenshots
          path: artifacts/pdf-layout-screenshots
          if-no-files-found: warn
